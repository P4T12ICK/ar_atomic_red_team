---

- name: Lookup technique for atomic GUID (Linux)
  become: true
  shell: |
    pwsh -Command "
    Import-Module /root/AtomicRedTeam/invoke-atomicredteam/Invoke-AtomicRedTeam.psd1 -Force
    \$targetGuid = '{{ item }}'
    Get-ChildItem /root/AtomicRedTeam/atomics -Recurse -Include T*.yaml | Get-AtomicTechnique | ForEach-Object {
      foreach (\$test in \$_.atomic_tests) {
        if (\$test.auto_generated_guid -eq \$targetGuid) {
          \$techId = \$_.attack_technique
          if (\$techId -is [array]) { \$techId = \$techId[0] }
          Write-Output \"\${techId}|\${targetGuid}\"
          exit 0
        }
      }
    }
    Write-Error \"Atomic test GUID not found: \$targetGuid\"
    exit 1
    "
  register: guid_resolution
  changed_when: false

- name: Append resolved atomic GUID execution (Linux)
  set_fact:
    ar_atomic_red_team_guid_executions: "{{ ar_atomic_red_team_guid_executions + [{'technique': (guid_resolution.stdout | trim).split('|')[0], 'guid': item}] }}"
